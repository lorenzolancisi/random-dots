<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Random Dots — display</title>
<style>
html,body{margin:0;height:100%;background:#fff;color:#111;font-family:system-ui,-apple-system,sans-serif}
#app{padding:1.5vh 2vw;box-sizing:border-box;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:2vw}
h1{font-size:3.2vh;margin:0 0 1vh}.timer{font-size:6vh;font-weight:800;font-variant-numeric:tabular-nums}.timer.zero{color:#c00}
.stim svg{display:block;width:100%;max-height:84vh;height:auto;margin:auto}.stim.small svg{max-height:34vh;width:auto;max-width:60vw}
.join{display:flex;gap:4vw;align-items:center;font-size:3.2vh}.qr svg{width:58vh;height:58vh}.url{font-size:4.5vh;font-weight:700}
.counts{font-size:4vh;font-weight:700}.qr-corner{position:fixed;right:1vw;bottom:1vh;background:#fff}.qr-corner svg{width:15vh;height:15vh}
.status{font-size:3vh;text-align:center;margin:.5vh}.hidden-stim{font-size:4.5vh;text-align:center;margin-top:30vh;color:#444}
.res{display:flex;gap:3vw;align-items:center}.truth{text-align:center;font-size:3vh}.truth .n{font-size:13vh;font-weight:800;color:#c00}
.chart svg{width:100%;height:auto;max-height:30vh}table{border-collapse:collapse;font-size:2.4vh;margin-top:1vh}
td,th{border-bottom:1px solid #ddd;padding:.4vh 1.2vw;text-align:right}td:first-child,th:first-child{text-align:left}
.gl{font-size:2.4vh}.debrief{font-size:2.8vh}.big{font-size:5vh;text-align:center;margin-top:30vh}.error{color:#c00}
button.fs{position:fixed;left:6px;bottom:6px;opacity:.25;font-size:18px}
button{font-size:22px;padding:10px 16px}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script type="module" src="js/display.js?v=mwy0ryb0"></script>
</body>
</html>

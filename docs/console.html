<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Random Dots — console</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:12px;font-size:17px;max-width:640px}
.card{border:1px solid #ccc;border-radius:10px;padding:10px;margin:10px 0}
button{font-size:1em;padding:10px 12px;margin:4px 6px 4px 0;border-radius:8px;border:1px solid #888;background:#f4f4f4}
button.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}button.big{width:100%;padding:16px;font-size:1.15em}
button.danger{background:#fff0f0;border-color:#c00;color:#c00}button:disabled{opacity:.5}
input{font-size:1.1em;padding:8px;max-width:9em}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{min-width:9em}.timer{font-size:2.2em;font-weight:700;margin:4px 0}.pill{background:#eef;padding:3px 10px;border-radius:12px;font-weight:600}
.error{color:#c00;font-weight:600}.ok{color:#080}.muted{color:#555}.small{font-size:.8em;word-break:break-all}
.preview svg{width:100%;height:auto;border:1px solid #999}.grp{border-top:1px solid #eee;padding-top:6px}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script type="module" src="js/console.js"></script>
</body>
</html>
